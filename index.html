<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LSQ Desk · Dugasta</title><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<header><div class="logo">LSQ<span>·</span>Desk</div><span class="mu">Dugasta Dubai · LeadSquared support</span><div class="sp"></div>
<a class="pill" href="t.html">Track ticket</a><div class="pill"><span class="dot" id="dot"></span><span id="av">Checking Surya…</span></div></header>
<main id="app"></main>
<script src="desk.js"></script>
<script>
const PB={
own:{t:'Lead ownership',d:'Lead with wrong RM / can’t see a lead',steps:['Search the lead by phone in LSQ → open it → check the “Owner” field.','If owner is wrong: only Admin/TL can reassign — ask your TL first (Manage Leads → Change Owner).','If you can’t see it at all: it may be owned by another team; your view only shows your leads.','Refresh after 2–3 min — auto-assignment rules can take a moment.']},
dup:{t:'Duplicate leads',d:'Same client appears twice',steps:['Search by phone AND email — LSQ dedupes on email/phone, so different formats (+971 vs 0) create duplicates.','Do NOT delete either copy — note both Lead IDs.','Check which copy has the latest activity; that one should be kept.','Merge needs Admin — raise a ticket with both Lead IDs.']},
stage:{t:'Wrong stage / status',d:'Stage stuck, jumped, or won’t update',steps:['Open lead → Activity History: see which activity/automation changed the stage.','Some stages are locked by mandatory fields — open the stage change form and look for red required fields.','If an automation keeps reverting it, stop editing and raise a ticket (it will loop).']},
login:{t:'Login / OTP / access',d:'Can’t sign in, OTP not coming, locked',steps:['Use the exact work email; try an incognito window.','OTP: wait 60s, check spam/promotions, don’t request more than 3 times (lockout ~15 min).','Mobile app: log out fully, update the app, log in again.','Still locked → ticket with your email + screenshot of the error.']},
calls:{t:'Calls (Knowlarity)',d:'Calls not logging, can’t dial, no recording',steps:['Check your agent number is correct in your LSQ profile.','Call logs sync with delay — wait 10 min before reporting.','Recording missing: only answered calls > few seconds are recorded.','Can’t dial: check mic/browser permission, then try the mobile app.']},
rep:{t:'Reports / dashboards',d:'Numbers wrong or report missing',steps:['Check the date filter and timezone (reports may use IST vs Dubai time).','Check owner/team filter — you may only see your own data.','Export to Excel and compare 2–3 sample leads against the lead records.','Still mismatched → ticket with report name + filters + the sample Lead IDs.']},
req:{t:'Lead Requirement',d:'Need leads allocated — say which types',steps:[]},
    other:{t:'Something else',d:'Not listed above',steps:[]}};
const S={};const app=document.getElementById('app');
function home(){app.innerHTML=`<h1>What’s broken in LeadSquared?</h1><p class="mu">Pick one. Most issues are fixed in 2 minutes with the steps. If not, you’ll get a ticket ID Surya works from — no WhatsApp chasing.</p>
<div class="grid">${Object.entries(PB).map(([k,p],i)=>`<button class="chip" onclick="pb('${k}')"><span class="k mono">${i+1}</span><b>${p.t}</b><small>${p.d}</small></button>`).join('')}</div>
<div class="card"><h2>Already raised one?</h2><div class="row" style="margin:0"><input id="q" class="mono" placeholder="LSQ-0001" style="max-width:220px"><button class="b" onclick="location.href='t.html?t='+encodeURIComponent(q.value)">Check status</button></div></div>
<p class="mu" style="font-size:12px">SLA · <b>P1</b> team blocked: 1h · <b>P2</b> one user blocked: 4h · <b>P3</b> how-to/annoyance: next business day (Surya’s hours Mon–Sat 09:00–18:00 IST)</p>`;}
function pb(k){S.pb=k;const p=PB[k];if(!p.steps.length)return rca();
app.innerHTML=`<div class="crumb"><a onclick="home()">Desk</a> / ${p.t}</div><h1>${p.t}</h1><div class="card"><h2>Try this first</h2><ol class="steps">${p.steps.map(s=>`<li>${s}</li>`).join('')}</ol>
<div class="row"><button class="b g" onclick="fixed()">✓ Fixed</button><button class="b p" onclick="rca()">Still broken → raise ticket</button></div></div>`;}
function fixed(){app.innerHTML=`<div class="card"><h1>Great — sorted.</h1><p class="mu">Nothing sent to Surya. Logged as self-solved on this device.</p><button class="b" onclick="home()">Back to Desk</button></div>`;try{const n=JSON.parse(localStorage.lsqFixed||'{}');n[S.pb]=(n[S.pb]||0)+1;localStorage.lsqFixed=JSON.stringify(n)}catch(e){}}
const LT=['Client Lead','Agent Lead','Agency Lead','Meta Paid Ads','Google Ads','Data / Pool','Other'];
function rca(){const p=PB[S.pb],me=JSON.parse(localStorage.lsqMe||'{}'),isReq=S.pb==='req';
app.innerHTML=`<div class="crumb"><a onclick="home()">Desk</a> / ${p.t} / Ticket</div><h1>Raise a ticket</h1><p class="mu">Fill it once, properly — Surya fixes it without calling you back for details.</p>
<form class="card" id="f"><div class="two"><div><label>Your name <i>*</i></label><input name="reporter_name" required value="${esc(me.n)}"></div><div><label>Work email <i>*</i></label><input name="reporter_email" type="email" required value="${esc(me.e)}"></div></div>
<div class="two"><div><label>Team <i>*</i></label><select name="team" required><option value="">Select…</option><option>Sales RM</option><option>DST</option><option>Team Lead</option><option>Marketing</option><option>Admin/Ops</option></select></div>
<div><label>Impact <i>*</i></label><select name="severity" required><option value="">Select…</option><option value="P1">P1 · whole team blocked</option><option value="P2">P2 · I’m blocked</option><option value="P3">P3 · annoying / how-to</option></select></div></div>
<div id="ltbox"${isReq?'':' hidden'}><label>Types of lead required <i>*</i></label><div class="opts">${LT.map(x=>`<label class="opt"><input type="checkbox" name="lead_types" value="${x}"> ${x}</label>`).join('')}</div></div>
<label>Lead ID / phone / email affected <i>*</i> <span class="mu">(type “none” if not lead-specific)</span></label><input name="lead_ref" class="mono" required>
<label>${isReq?'How many leads, which country, and any other detail?':'What happened?'} <i>*</i></label><textarea name="summary" required minlength="10" placeholder="${isReq?'e.g. 20 UAE Client Leads, needed today':'Steps you did, what you saw, exact error text'}"></textarea>
<label>${isReq?'When do you need them?':'What should happen instead?'} <i>*</i></label><textarea name="expected" required></textarea>
<label>Already tried</label><input name="tried" value="${p.steps.length?'Followed Desk playbook: '+p.t:''}">
<label>Screenshot link (optional) — Drive / Imgur / any URL</label><input name="screenshot_url" type="url" placeholder="https://">
<div class="row"><button class="b p" id="sb">Create ticket</button><button type="button" class="b" onclick="pb(S.pb)">Back</button></div></form>`;
f.onsubmit=async e=>{e.preventDefault();const types=[...f.querySelectorAll('input[name=lead_types]:checked')].map(i=>i.value);if(isReq&&!types.length){alert('Select at least one type of lead required.');return;}sb.disabled=true;sb.textContent='Creating…';const p=Object.fromEntries(new FormData(f));delete p.lead_types;p.lead_types=types.join(', ');p.playbook=PB[S.pb].t;p.ua=navigator.userAgent;
localStorage.lsqMe=JSON.stringify({n:p.reporter_name,e:p.reporter_email});S.t=await createTicket(p);S.p=p;done();};}
function mail(){const t=S.t,p=S.p;const b=`Ticket ${t.code} (${p.severity})\nPlaybook: ${p.playbook}\nFrom: ${p.reporter_name} <${p.reporter_email}> · ${p.team}\nLead ref: ${p.lead_ref}\n${p.lead_types?`Types of lead required: ${p.lead_types}\n`:''}\nWhat happened:\n${p.summary}\n\nExpected:\n${p.expected}\n\nTried: ${p.tried||'-'}\nScreenshot: ${p.screenshot_url||'-'}\n\nStatus: ${location.origin+location.pathname.replace(/index\.html$/,'')}t.html?t=${t.code}`;
return `mailto:${SURYA}?cc=${encodeURIComponent(p.reporter_email)}&subject=${encodeURIComponent(`[LSQ Support] [${t.code}] ${p.severity} ${p.playbook} — ${p.reporter_name}`)}&body=${encodeURIComponent(b)}`;}
function done(){const t=S.t,db=t.mode==='db';
app.innerHTML=`<div class="card"><div class="mu">Ticket created</div><div class="tid mono">${t.code}</div><span class="st">${t.status}</span>
<p>${db?'Saved in the Dugasta support queue. Check your email for confirmation; if you don’t see it, use Email ticket below.':'<span class="warn">Saved on this device (central queue not switched on yet). <b>Send the email below</b> so Surya receives it.</span>'}</p>
<div class="row"><a href="${mail()}"><button class="b ${db?'':'p'}">${db?'Also email Surya (optional)':'Email ticket to Surya'}</button></a><a href="t.html?t=${t.code}"><button class="b">Open status page</button></a><button class="b" onclick="navigator.clipboard.writeText('${t.code}')">Copy ID</button></div></div>
<div class="card" id="bk"><h2>Want 15 minutes with Surya?</h2><p class="mu">Only for P1/P2 or if it’s easier to show on screen.</p><div class="slots" id="sl">Loading…</div></div>`;slots();}
let AV=null;fetch('./availability.json',{cache:'no-store'}).then(r=>r.json()).then(j=>{AV=j;const busy=j.status==='busy';dot.className='dot '+(busy?'busy':'free');av.textContent=busy?'Surya in a meeting':(j.status_label||'Surya available');if(document.getElementById('sl'))slots();}).catch(()=>av.textContent='Calendar pending');
function slots(){const el=document.getElementById('sl');if(!el||!AV)return;const now=Date.now();const fr=(AV.slots||[]).filter(s=>s.free&&new Date(s.start)>now).slice(0,12);
if(!fr.length){el.textContent='No open slots right now — your ticket is in the queue.';return;}
el.innerHTML=fr.map(s=>{const a=new Date(s.start);return `<button class="b slot" onclick="book('${s.start}')">${a.toLocaleString('en-GB',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'})} Dubai</button>`}).join('');}
function book(st){const a=new Date(st),b=new Date(a.getTime()+9e5),f=d=>d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
window.open(`https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`[${S.t.code}] LSQ support · 15 min`)}&details=${encodeURIComponent(`Ticket ${S.t.code}\n${S.p.summary}`)}&dates=${f(a)}/${f(b)}&add=${SURYA}`,'_blank');
document.getElementById('bk').innerHTML='<h2>Invite opened</h2><p class="mu">Save the invite in Google Calendar — it requests the slot; it isn’t reserved until Surya accepts.</p>';}
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;const k=Object.keys(PB)[+e.key-1];if(k)pb(k);});
home();
</script></body></html>
